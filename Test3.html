<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="Test3.css">
    <link rel="website icon" type="png" href="FCLogo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agricultural Contribution to GDP - Jordan</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
</head>
<body>
    
    <div class="container">
        <header>
            <h1>Agricultural Contribution to GDP in Jordan</h1>
            <p class="description">Analysis of the agricultural sector's contribution to Jordan's GDP (2018-2023)</p>
        </header>
        
        <div class="controls">
            <select id="chartType">
                <option value="line">Line Chart</option>
                <option value="bar">Bar Chart</option>
            </select>
            
            <button id="applyChart">Change Chart</button>
        </div>
        
        <div class="chart-container">
            <canvas id="gdpChart"></canvas>
        </div>
        
       
    </div>

   <script src="Test3.js"></script>
</body>
</html>
